<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xuất hoá đơn - Nạp Thẻ Nguyễn Phước</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#0b2447;--mut:#4b5d78;--navy:#0b2447;--blue:#1565c0;--or:#f26b21;--line:#d5e1f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08162b;--card:#0f2444;--ink:#eaf1fb;--mut:#9db1cf;--line:#1f3a63}}
:root[data-theme="dark"]{--bg:#08162b;--card:#0f2444;--ink:#eaf1fb;--mut:#9db1cf;--line:#1f3a63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,Arial,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff}
.hd{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.hd .lg{background:#fff;border-radius:10px;padding:4px;width:120px}.hd img{width:100%;display:block;border-radius:6px}
.hd h1{margin:0;font-size:clamp(18px,4vw,26px);font-weight:800;flex:1}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font:700 14px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;background:var(--or);color:#fff}
.btn.alt{background:var(--blue)}.btn.ghost{background:transparent;border:2px solid var(--blue);color:var(--blue)}.btn.red{background:#c62828}.btn.sm{padding:7px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fb4ff;outline-offset:2px}
.tabs{display:flex;gap:8px;margin:18px 0}
.tabs .btn{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px;color:var(--blue)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 15px 'Be Vietnam Pro',system-ui,sans-serif}
.row{display:flex;gap:8px}.row input{flex:1}
.cardbox{border:1px dashed var(--blue);border-radius:12px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hist{width:100%;border-collapse:collapse;font-size:14px}.hist th,.hist td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}.acts{display:flex;gap:6px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
#invp{display:none}
#invoice{position:relative;width:1056px;min-height:816px;background:#fff;color:#000;padding:65px 48px 48px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.3;overflow:hidden;border:1px solid #ddd}
#invoice .wm{position:absolute;left:50%;top:50%;width:962px;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
#invoice .head{width:508px;display:block;margin:0 0 15px}
#invoice h4{color:#c00000;font-size:17.33px;margin:0 0 15px;font-weight:700;line-height:1.3}
#invoice h5{font-size:14px;margin:12.5px 0 14.5px;font-weight:700;line-height:1.3}
#invoice h5.t{margin:14px 0 7px}
#invoice ul{margin:0;padding-left:24px}#invoice li{margin:0;font-size:13.33px;line-height:1.48}#invoice ul.c li{line-height:1.55}#invoice p{margin:0}
#invoice .rel{position:relative;z-index:1}
@media(max-width:700px){.g{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
@page{size:letter landscape;margin:0}@media print{body *{visibility:hidden}#invoice,#invoice *{visibility:visible}#invoice{position:absolute;left:0;top:0;border:0}}
</style></head><body>

const $=i=>document.getElementById(i),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US')+'đ';
let H=[],editId=null,manual=false,cur=null;
try{H=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){H=[]}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(H))}catch(e){$('msg').textContent='Không lưu được vào trình duyệt, hãy bấm Sao lưu.'}};
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
const nowL=()=>{const t=new Date();return `${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}T${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())}`};
const fmtT=v=>{const m=/(\d+)-(\d+)-(\d+)T(\d+):(\d+)(?::(\d+))?/.exec(v||'');return m?`${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]}:${m[6]||'00'}`:''};
const fmtD=v=>{const m=/(\d+)-(\d+)-(\d+)/.exec(v||'');return m?`${m[3]}/${m[2]}/${m[1]} 00:00:00`:''};
function newId(){let x;do{x=String(Math.floor(Math.random()*1e8)).padStart(8,'0')}while(H.some(h=>h.id===x));return x}
$('newid').onclick=()=>$('id').value=newId();
function cardVals(){return [...document.querySelectorAll('.cardbox')].map(b=>({code:b.querySelector('.c').value,serial:b.querySelector('.s').value,hsd:b.querySelector('.h').value,type:b.querySelector('.t').value,man:b.querySelector('.t').dataset.m==='1',den:+b.querySelector('.d').value||0,dman:b.querySelector('.d').dataset.m==='1'}))}
function renderCards(vals){
  const n=Math.min(30,Math.max(1,+$('qty').value||1)),old=vals||cardVals();
  $('cards').innerHTML=Array.from({length:n},(_,i)=>{const o=old[i]||{};return `<div class="cardbox"><h3>Thẻ ${p2(i+1)}</h3><div class="g"><div><label>Loại thẻ</label><input class="t" list="types" data-m="${o.man?1:0}" value="${esc(o.type!==undefined?o.type:$('type').value)}"></div><div><label>Mệnh giá / giá (đ)</label><input class="d" type="number" min="0" step="1000" data-m="${o.dman?1:0}" value="${o.den!==undefined?o.den:$('den').value}"></div><div><label>Mã thẻ</label><input class="c" value="${esc(o.code)}"></div><div><label>Mã seri</label><input class="s" value="${esc(o.serial)}"></div><div><label>Hạn sử dụng</label><input class="h" type="date" value="${esc(o.hsd)}"></div></div></div>`}).join('');
}
function calc(){if(manual)return;const ds=[...document.querySelectorAll('.cardbox .d')].map(x=>+x.value||0),t=ds.reduce((a,b)=>a+b,0)-(+$('disc').value||0);$('total').value=Math.max(0,t)}
$('disc').addEventListener('input',calc);
$('den').addEventListener('input',()=>{document.querySelectorAll('.cardbox .d').forEach(d=>{if(d.dataset.m!=='1')d.value=$('den').value});calc()});
$('type').addEventListener('input',()=>document.querySelectorAll('.cardbox .t').forEach(t=>{if(t.dataset.m!=='1')t.value=$('type').value}));
$('cards').addEventListener('input',e=>{const c=e.target.classList;if(c.contains('t'))e.target.dataset.m='1';if(c.contains('d')){e.target.dataset.m='1';calc()}});
$('qty').addEventListener('input',()=>{renderCards();calc()});
$('total').addEventListener('input',()=>manual=true);
$('auto').onclick=()=>{manual=false;calc()};
function resetForm(){editId=null;manual=false;['name','type','den'].forEach(i=>$(i).value='');$('qty').value=1;$('disc').value=0;$('id').value=newId();$('time').value=nowL();$('ftitle').textContent='Thông tin giao dịch';renderCards([]);calc();$('msg').textContent=''}
$('reset').onclick=resetForm;
const uname=n=>{const t=String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/\s+/g,'').toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1)};
const typesOf=r=>{const l=r.cards.map(c=>(c.type!==undefined&&c.type!==''?c.type:r.type)||'').map(x=>x.trim());return l};
function inv(r){
  const tl=typesOf(r),uniq=[...new Set(tl.filter(Boolean))],multi=uniq.length>1,tsum=uniq.length?uniq.join(', '):r.type,dl=r.cards.map(c=>c.den!==undefined?c.den:r.den),multiD=new Set(dl).size>1,dsum=multiD?[...new Set(dl)].map(money).join(', '):money(dl.length?dl[0]:r.den);
  const cards=r.cards.map((c,i)=>`<h5>Mã Thẻ ${p2(i+1)}:</h5><ul class="c">${multi?`<li>Loại Thẻ: <b>${esc(tl[i])}</b></li>`:''}${multiD?`<li>Mệnh Giá: <b>${money(dl[i])}</b></li>`:''}<li>Mã Thẻ: <b>${esc(c.code)}</b></li><li>Mã Seri: <b>${esc(c.serial)}</b></li><li>Hsd: <b>${fmtD(c.hsd)}</b></li></ul>`).join('');
  return `<div class="rel"><img class="head" src="${HEADIMG}" alt="Logo Nạp Thẻ Nguyễn Phước"><h4>NAPTHENGUYENPHUOC</h4>
<p>Kính Chào Quý Khách <b>${esc(uname(r.name))}</b>,</p><p>Quý Khách Đã Giao Dịch Mua Mã Thẻ Thành Công Trên Hệ Thống Napthenguyenphuoc.</p>
<h5 class="t">Thông Tin Giao Dịch:</h5>
<ul><li>Tên Khách Hàng: <b>${esc(r.name)}</b></li><li>Mã Hóa Đơn / Mã Giao Dịch: <b>${esc(r.id)}</b></li><li>Thời Gian: <b>${fmtT(r.time)}</b></li><li>Loại Thẻ: <b>${esc(tsum)}</b></li><li>Mệnh Giá: <b>${dsum}</b></li><li>Số Lượng: <b>${r.qty}</b></li>${r.disc>0?`<li>Giảm Giá: <b>${money(r.disc)}</b></li>`:''}<li>Thành Tiền: <b>${money(r.total)}</b></li></ul>
<p style="margin-top:28px">Dưới Đây Là Thông Tin Chi Tiết Về Các Mã Thẻ Quý Khách Đã Mua:</p>${cards}
<p style="margin-top:31px;font-size:13.33px;white-space:nowrap">Cảm Ơn Quý Khách Đã Sử Dụng Dịch Vụ Của Chúng Tôi!</p>
<p style="font-size:13.33px;white-space:nowrap">Mọi Thắc Mắc Xin Vui Lòng Liên Hệ Napthenguyenphuoc Qua Email: <span style="color:#0b6bb5">Hotrohuuphuoc@Gmail.Com</span> Hoặc Số Hotline: <b>0384333135 - 0964910736</b> Trân Trọng!</p></div>`}
function show(r){cur=r;$('invoice').innerHTML=inv(r);$('invp').style.display='block';$('invp').scrollIntoView({behavior:'smooth'})}
$('save').onclick=()=>{
  const name=$('name').value.trim(),id=$('id').value.trim();
  if(!name){$('name').focus();$('msg').textContent='Vui lòng nhập tên khách hàng.';return}
  if(!/^\d{8}$/.test(id)){$('id').focus();$('msg').textContent='Mã giao dịch phải gồm đúng 8 chữ số.';return}
  if(H.some(h=>h.id===id&&h.id!==editId)){$('msg').textContent='Mã giao dịch này đã tồn tại, hãy bấm Tạo lại.';return}
  const r={id,name,time:$('time').value||nowL(),type:$('type').value.trim(),den:+$('den').value||0,qty:Math.max(1,+$('qty').value||1),disc:+$('disc').value||0,total:+$('total').value||0,cards:cardVals(),saved:Date.now()};
  const i=H.findIndex(h=>h.id===editId);
  if(i>=0)H[i]=r;else H.unshift(r);
  persist();renderH();show(r);editId=null;$('ftitle').textContent='Thông tin giao dịch';$('msg').textContent='Đã lưu vào lịch sử.';
};
function renderH(){
  const q=$('q').value.trim().toLowerCase();$('t2').textContent=`Lịch sử (${H.length})`;
  const L=H.filter(h=>!q||h.id.includes(q)||h.name.toLowerCase().includes(q));
  $('hb').innerHTML=L.length?L.map(h=>`<tr><td><b>${esc(h.id)}</b></td><td>${fmtT(h.time)}</td><td>${esc(h.name)}</td><td>${esc([...new Set((h.cards||[]).map(c=>c.type||h.type).filter(Boolean))].join(', ')||h.type)} x${h.qty}</td><td>${money(h.total)}</td><td><div class="acts"><button class="btn sm" data-a="v" data-i="${esc(h.id)}">Xuất lại</button><button class="btn alt sm" data-a="e" data-i="${esc(h.id)}">Sửa</button><button class="btn red sm" data-a="d" data-i="${esc(h.id)}">Xoá</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="mut">Chưa có hoá đơn nào. Hãy tạo hoá đơn ở tab "Tạo hoá đơn".</td></tr>';
}
$('q').oninput=renderH;
$('hb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=H.find(h=>h.id===b.dataset.i);if(!r)return;
  if(b.dataset.a==='v')show(r);
  else if(b.dataset.a==='d'){if(confirm('Xoá hoá đơn '+r.id+'?')){H=H.filter(h=>h!==r);persist();renderH()}}
  else{tab(1);editId=r.id;manual=true;$('name').value=r.name;$('id').value=r.id;$('time').value=r.time;$('type').value=r.type;$('den').value=r.den;$('qty').value=r.qty;$('disc').value=r.disc;$('total').value=r.total;renderCards(r.cards);$('ftitle').textContent='Sửa hoá đơn '+r.id;window.scrollTo({top:0,behavior:'smooth'})}};
function tab(n){$('v1').style.display=n==1?'':'none';$('v2').style.display=n==2?'':'none';$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)renderH()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
$('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(H)],{type:'application/json'}));a.download='lich-su-hoa-don.json';a.click()};
$('rs').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;d.forEach(x=>{if(x&&x.id&&!H.some(h=>h.id===x.id))H.push(x)});H.sort((a,b)=>(b.saved||0)-(a.saved||0));persist();renderH();alert('Đã khôi phục '+d.length+' hoá đơn.')}catch(_){alert('File sao lưu không hợp lệ.')}};rd.readAsText(f);e.target.value=''};
$('print').onclick=()=>window.print();
$('pdf').onclick=async()=>{
  const b=$('pdf');b.disabled=true;b.textContent='Đang tạo PDF...';
  try{
    const c=await html2canvas($('invoice'),{scale:2,backgroundColor:'#fff'});
    const pdf=new window.jspdf.jsPDF('l','mm','letter'),W=279.4,PH=215.9,ph=Math.floor(c.width*PH/W);
    for(let y=0,pg=0;y<c.height;y+=ph,pg++){
      const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(ph,c.height-y);
      const x=s.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,s.width,s.height);x.drawImage(c,0,y,c.width,s.height,0,0,c.width,s.height);
      if(pg)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,W,s.height*W/c.width);
    }
    pdf.save('hoa-don-'+cur.id+'.pdf');
  }catch(e){alert('Không tạo được PDF. Hãy thử lại hoặc dùng nút In hoá đơn.')}
  b.disabled=false;b.textContent='Tải file PDF';
};
resetForm();renderH();
</script></body></html>
